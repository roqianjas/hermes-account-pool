name: account-pool-tracker
label: Account Pool Tracker
version: 1.5.0
description: "Records which credential-pool account each session uses and the tokens each account, profile, model and session used, for `hermes account <provider> who`, `report`, `sessions` and the Accounts page. No commands, no tools; one post_api_request hook."
author: roqianjas
license: MIT
requires_hermes: ">=0.21"
tags: [auth, credential-pool]
provides_tools: []
provides_hooks: [post_api_request]
